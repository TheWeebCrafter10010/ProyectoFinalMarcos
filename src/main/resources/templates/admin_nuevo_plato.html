<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Nuevo Plato | Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 card p-4 shadow-sm border-0 border-top border-warning border-4">
                <h3 class="fw-bold mb-4">Agregar Nuevo Plato al Menú</h3>

                <form th:action="@{/admin/guardarPlato}" method="post" th:object="${plato}">
                    <input type="hidden" th:field="*{id_plato}" />

                    <div class="mb-3">
                        <label class="form-label fw-bold">Nombre del Plato</label>
                        <input type="text" th:field="*{nombre}" class="form-control" placeholder="Ej: Lomo Saltado"
                            required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Descripción Corta</label>
                        <textarea th:field="*{descripcion}" class="form-control" rows="2"
                            placeholder="Ingredientes principales..." required></textarea>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">Precio (S/)</label>
                            <input type="number" step="0.01" th:field="*{precio}" class="form-control" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">Tiempo (min)</label>
                            <input type="number" th:field="*{tiempo_preparacion}" class="form-control"
                                placeholder="Ej: 15" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Categoría</label>
                        <select name="idCategoriaSelect" class="form-select" required>
                            <option value="">Selecciona una categoría...</option>
                            <option th:each="cat : ${categorias}" th:value="${cat.id_categoria}"
                                th:text="${cat.nombre}"></option>
                        </select>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-bold">Ruta de Imagen</label>
                        <input type="text" th:field="*{imagen}" class="form-control"
                            placeholder="Ej: img/LomoSaltado.jpg" required>
                    </div>

                    <div class="d-flex justify-content-end gap-2">
                        <a href="/admin/dashboard" class="btn btn-outline-secondary fw-bold">Cancelar</a>
                        <button type="submit" class="btn btn-warning fw-bold px-4">Guardar Plato</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>

</html>
