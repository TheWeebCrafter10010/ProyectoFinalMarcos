<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reservar mesa | Sabor y Tradición</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { min-height: 100vh; background: linear-gradient(rgba(0,0,0,.72), rgba(0,0,0,.72)), url('/img/reserva.jpg') center/cover fixed; }
        .reserva-card { max-width: 760px; border: 0; border-radius: 24px; }
        .form-control, .form-select { min-height: 50px; }
    </style>
</head>
<body class="d-flex align-items-center py-5">
<div class="container">
    <div class="card reserva-card mx-auto shadow-lg">
        <div class="card-body p-4 p-md-5">
            <div class="text-center mb-4">
                <span class="badge text-bg-warning mb-2">Reserva en línea</span>
                <h1 class="h3 fw-bold">Reserva tu mesa</h1>
                <p class="text-muted mb-0">Completa todos los datos en un solo paso.</p>
            </div>

            <div th:if="${errorMesas}" class="alert alert-danger" th:text="${errorMesas}"></div>

            <form th:action="@{/reservar/guardar}" method="post" th:object="${reserva}" class="row g-3">
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Cantidad de personas</label>
                    <select class="form-select" th:field="*{cantidadPersonas}" required>
                        <option th:each="n : ${#numbers.sequence(1, 10)}" th:value="${n}" th:text="${n + (n == 1 ? ' persona' : ' personas')}"></option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Teléfono</label>
                    <input class="form-control" type="tel" th:field="*{telefono}" placeholder="999 999 999"
                           minlength="7" maxlength="15" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Fecha</label>
                    <input class="form-control" type="date" th:field="*{fecha}" th:attr="min=${fechaMinima}" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Hora</label>
                    <input class="form-control" type="time" th:field="*{hora}" min="12:00" max="22:30" required>
                </div>
                <div class="col-12 mt-4 d-flex flex-column flex-sm-row gap-2">
                    <a th:href="@{/index}" class="btn btn-outline-secondary flex-fill py-3">Cancelar</a>
                    <button class="btn btn-warning flex-fill py-3 fw-bold" type="submit">Confirmar reserva</button>
                </div>
            </form>
            <p class="small text-muted text-center mt-3 mb-0">Al confirmar, recibirás un correo con los datos de tu reserva.</p>
        </div>
    </div>
</div>
</body>
</html>
