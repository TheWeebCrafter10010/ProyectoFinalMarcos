<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Editar Usuario | Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light d-flex align-items-center" style="min-height: 100vh;">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5 card p-4 shadow-sm border-0">
                <h3 class="fw-bold mb-4">Modificar Usuario</h3>
                <form th:action="@{/admin/guardarUsuario}" method="post">
                    <input type="hidden" name="id_usuario" th:value="${usuarioEdit.id_usuario}">

                    <div class="mb-3">
                        <label class="form-label fw-bold">Nombre Completo</label>
                        <input type="text" name="nombre" class="form-control" th:value="${usuarioEdit.nombre}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Correo Electrónico</label>
                        <input type="email" name="email" class="form-control" th:value="${usuarioEdit.email}" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-bold">Nivel de Acceso (Rol)</label>
                        <select name="rol" class="form-select">
                            <option value="USER" th:selected="${usuarioEdit.rol == 'USER'}">Cliente (USER)</option>
                            <option value="ADMIN" th:selected="${usuarioEdit.rol == 'ADMIN'}">Administrador (ADMIN)
                            </option>
                        </select>
                    </div>

                    <div class="d-flex justify-content-between">
                        <a href="/admin/dashboard" class="btn btn-link text-muted text-decoration-none">Cancelar</a>
                        <button type="submit" class="btn btn-primary fw-bold px-4">Guardar Cambios</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>

</html>
